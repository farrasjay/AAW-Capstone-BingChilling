# auth service

apiVersion: v1
kind: Service
metadata:
  name: authentication-api
spec:
  selector:
    app: authentication
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer
---
# orders service

apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: LoadBalancer
---
