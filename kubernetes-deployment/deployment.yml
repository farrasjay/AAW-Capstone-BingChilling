# auth service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-api
  labels:
    app: authentication
spec:
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
    spec:
      containers:
        - name: authentication
          image: farrasjay/capstone-authentication:latest
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "200m"
            limits:
              memory: "400Mi"
          env:
            - name: AUTH_MS_URL
              value: http://authentication-api.default.svc.cluster.local:8000
            - name: PRODUCT_MS_URL
              value: http://products-api.default.svc.cluster.local:8002
            - name: TENANT_MS_URL
              value: http://tenant-api.default.svc.cluster.local:8003
            - name: DB_HOST
              value: auth-database.cj9okkh95hta.us-east-1.rds.amazonaws.com
            - name: TENANT_ID
              value: 47dd6b24-0b23-46b0-a662-776158d089ba
            - name: JWT_SECRET
              value: auth_ms_jwt_secret
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
---
